<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <radialGradient id="bg" cx="66%" cy="34%" r="85%">
      <stop offset="0" stop-color="#4a0f10"/>
      <stop offset=".4" stop-color="#1c080c"/>
      <stop offset="1" stop-color="#050407"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#ff5a2a" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#c22a16" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c22a16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="demonBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0b0d"/>
      <stop offset=".55" stop-color="#0f0608"/>
      <stop offset="1" stop-color="#070405"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a33" stop-opacity="0"/>
      <stop offset=".6" stop-color="#d63a22" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff8a4a" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0c0d"/>
      <stop offset="1" stop-color="#070406"/>
    </linearGradient>
    <filter id="b40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="b14"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>

  <!-- moon -->
  <circle cx="652" cy="218" r="250" fill="url(#moonGlow)" filter="url(#b40)"/>
  <circle cx="652" cy="218" r="74" fill="#d84a24" opacity=".55"/>
  <circle cx="652" cy="218" r="74" fill="#ff8a55" opacity=".18"/>

  <!-- lightning -->
  <path d="M120 0 L96 180 L140 168 L96 352" stroke="#ff7a55" stroke-width="3" fill="none" opacity=".35" filter="url(#b4)"/>
  <path d="M790 0 L818 150 L780 142 L822 300" stroke="#ff7a55" stroke-width="2" fill="none" opacity=".22" filter="url(#b4)"/>

  <!-- far city -->
  <g fill="#0d0508" opacity=".9">
    <rect x="0" y="790" width="92" height="240"/>
    <rect x="96" y="838" width="66" height="192"/>
    <rect x="170" y="762" width="104" height="268"/>
    <rect x="280" y="852" width="60" height="178"/>
    <rect x="346" y="806" width="88" height="224"/>
    <rect x="440" y="866" width="52" height="164"/>
    <rect x="700" y="784" width="96" height="246"/>
    <rect x="800" y="836" width="100" height="194"/>
  </g>
  <g fill="#25090b" opacity=".55">
    <rect x="190" y="800" width="10" height="10"/>
    <rect x="220" y="830" width="8" height="8"/>
    <rect x="366" y="840" width="10" height="10"/>
    <rect x="390" y="880" width="8" height="8"/>
    <rect x="720" y="820" width="10" height="10"/>
    <rect x="750" y="860" width="8" height="8"/>
  </g>

  <!-- fire glow on horizon -->
  <ellipse cx="420" cy="1000" rx="460" ry="120" fill="#a8231a" opacity=".4" filter="url(#b40)"/>

  <!-- ground -->
  <rect y="986" width="900" height="114" fill="url(#ground)"/>
  <path d="M0 986 H900" stroke="#8a2a1c" stroke-width="2" opacity=".4"/>

  <!-- smoke -->
  <g filter="url(#b40)" opacity=".5">
    <ellipse cx="470" cy="420" rx="240" ry="120" fill="#3a0c10"/>
    <ellipse cx="740" cy="520" rx="220" ry="140" fill="#2a080c"/>
  </g>

  <!-- demon aura -->
  <ellipse cx="590" cy="720" rx="290" ry="330" fill="#8a1812" opacity=".28" filter="url(#b40)"/>

  <!-- demon body -->
  <path d="M492 1000
           C462 930 458 810 474 700
           C484 628 508 566 548 528
           C536 508 540 484 566 476
           C600 466 636 486 630 518
           C676 544 702 604 716 690
           C736 812 736 930 698 1000
           C640 1024 546 1024 492 1000 Z" fill="url(#demonBody)"/>

  <!-- shoulders / muscle plates -->
  <path d="M500 600 C520 556 560 534 600 532 C648 532 684 560 704 610 C666 588 622 580 590 588 C552 596 522 604 500 630 Z" fill="#180a0b"/>

  <!-- horns -->
  <path d="M552 496 C520 452 498 388 506 322 C522 366 548 414 570 440 Z" fill="#170a0b"/>
  <path d="M628 492 C664 446 690 380 688 318 C668 360 644 410 618 438 Z" fill="#170a0b"/>
  <path d="M506 322 C512 372 528 414 552 448" stroke="#7a2415" stroke-width="2" fill="none" opacity=".45"/>
  <path d="M688 318 C678 370 658 414 632 446" stroke="#7a2415" stroke-width="2" fill="none" opacity=".45"/>

  <!-- head -->
  <path d="M548 520 C536 486 552 462 586 458 C622 454 644 480 638 516 C634 544 612 562 584 560 C562 558 552 544 548 520 Z" fill="#120708"/>

  <!-- eyes -->
  <g filter="url(#b14)">
    <ellipse cx="566" cy="506" rx="14" ry="8" fill="#ff4a1e" opacity=".9" transform="rotate(-8 566 506)"/>
    <ellipse cx="614" cy="504" rx="14" ry="8" fill="#ff4a1e" opacity=".9" transform="rotate(8 614 504)"/>
  </g>
  <ellipse cx="566" cy="506" rx="7" ry="4" fill="#ffd2a0" transform="rotate(-8 566 506)"/>
  <ellipse cx="614" cy="504" rx="7" ry="4" fill="#ffd2a0" transform="rotate(8 614 504)"/>

  <!-- brow ridge -->
  <path d="M542 486 C556 476 574 478 584 488" stroke="#2a0d0c" stroke-width="4" fill="none"/>
  <path d="M638 484 C624 474 606 476 596 486" stroke="#2a0d0c" stroke-width="4" fill="none"/>

  <!-- jaws -->
  <path d="M560 538 C578 552 606 552 624 536 C618 560 600 572 584 572 C570 570 562 556 560 538 Z" fill="#070304"/>
  <path d="M568 546 l8 -10 6 12 8 -12 6 12 8 -12 6 12" stroke="#d8b48a" stroke-width="3" fill="none" opacity=".65"/>
  <path d="M566 560 C580 568 604 568 618 558" stroke="#5a1a12" stroke-width="2" fill="none" opacity=".6"/>

  <!-- chest ribs -->
  <g stroke="#5a1a12" stroke-width="2" fill="none" opacity=".4">
    <path d="M530 632 C560 620 620 620 660 640"/>
    <path d="M524 668 C560 654 626 654 668 674"/>
    <path d="M520 704 C560 690 630 690 674 710"/>
    <path d="M518 740 C560 726 634 726 678 746"/>
  </g>

  <!-- arms -->
  <path d="M512 596 C458 612 402 656 356 704 C338 724 322 742 306 750" stroke="#0e0607" stroke-width="44" stroke-linecap="round" fill="none"/>
  <path d="M684 598 C746 612 800 650 838 690" stroke="#0e0607" stroke-width="44" stroke-linecap="round" fill="none"/>
  <path d="M330 716 C300 742 270 760 238 770" stroke="#120708" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M824 682 C850 700 872 716 888 736" stroke="#120708" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- claws -->
  <g stroke="#1e0a0a" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M238 770 C210 782 188 776 172 792"/>
    <path d="M244 782 C216 802 196 802 184 820"/>
    <path d="M256 788 C238 812 226 818 220 838"/>
    <path d="M886 736 C902 756 902 776 916 790"/>
    <path d="M874 744 C886 770 884 790 898 806"/>
  </g>

  <!-- legs -->
  <path d="M520 890 C506 934 500 970 506 1002 L556 1002 C552 962 558 926 570 892 Z" fill="#0c0506"/>
  <path d="M648 890 C664 934 670 970 664 1002 L616 1002 C620 962 612 926 600 892 Z" fill="#0b0405"/>

  <!-- rim light -->
  <path d="M716 690 C736 812 736 930 698 1000" stroke="url(#rim)" stroke-width="3" fill="none" opacity=".75"/>
  <path d="M630 518 C676 544 702 604 716 690" stroke="url(#rim)" stroke-width="2.5" fill="none" opacity=".6"/>
  <path d="M638 516 C644 490 630 470 604 462" stroke="#e2582a" stroke-width="2" fill="none" opacity=".4"/>
  <path d="M688 318 C680 372 664 418 640 452" stroke="#c23a20" stroke-width="1.6" fill="none" opacity=".3"/>

  <!-- embers -->
  <g fill="#ff8a4a">
    <circle cx="330" cy="560" r="2.4" opacity=".8"/>
    <circle cx="270" cy="700" r="1.8" opacity=".6"/>
    <circle cx="720" cy="420" r="2" opacity=".7"/>
    <circle cx="790" cy="580" r="1.5" opacity=".5"/>
    <circle cx="430" cy="820" r="2.2" opacity=".55"/>
    <circle cx="500" cy="280" r="1.6" opacity=".45"/>
    <circle cx="660" cy="340" r="1.3" opacity=".5"/>
    <circle cx="180" cy="520" r="1.7" opacity=".4"/>
    <circle cx="840" cy="480" r="1.4" opacity=".45"/>
    <circle cx="380" cy="920" r="1.8" opacity=".35"/>
  </g>

  <rect width="900" height="1100" fill="url(#vignette)"/>
  <rect width="900" height="1100" filter="url(#grain)" opacity=".06"/>
</svg>
